[workspace]
members = [".", "benches"]
default-members = ["."]

[package]
name = "gotmpl"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
description = "A Rust reimplementation of Go's text/template library"
repository = "https://github.com/phsym/gotmpl-rs"
documentation = "https://docs.rs/gotmpl"
license = "MIT"
readme = "README.md"
authors = ["Pierre-Henri Symoneaux"]
keywords = ["template", "golang", "templating", "parser", "no-std"]
categories = ["template-engine", "parser-implementations", "no-std", "text-processing"]
exclude = ["TODO.md", "TODO-TEST-COMPAT.md", "OPTIMIZATIONS.md"]

[features]
default = ["std", "glob"]
# Enables `std`-only APIs (io::Write-based execute, parse_files, catch_unwind
# around user function panics).
std = []
# Enables `Template::parse_glob` (loads templates by glob pattern). Implies
# `std`; disabling `std` therefore also drops `glob`.
glob = ["std", "dep:glob"]
# When enabled, the test suite additionally shells out to a Go helper and
# asserts output parity with Go's `text/template`. Intended for tests only;
# requires a `go` toolchain on PATH.
go-crosscheck = []

[dependencies]
thiserror = "2"
smol_str = { version = "0.3", default-features = false }
glob = { version = "0.3", optional = true }

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
debug = true
strip = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
