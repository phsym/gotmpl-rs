[workspace]
members = [".", "benches"]
default-members = ["."]

[package]
name = "gotmpl"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
description = "A Rust reimplementation of Go's text/template library"
repository = "https://github.com/phsym/gotmpl-rs"
documentation = "https://docs.rs/gotmpl"
license = "MIT"
readme = "README.md"
authors = ["Pierre-Henri Symoneaux"]
keywords = ["template", "golang", "templating", "parser", "no-std"]
categories = ["template-engine", "parser-implementations", "no-std", "text-processing"]
exclude = ["TODO.md", "TODO-TEST-COMPAT.md", "OPTIMIZATIONS.md"]

[features]
default = ["std", "glob"]
# Enables `std`-only APIs (io::Write-based execute, parse_files, catch_unwind
# around user function panics). When `serde` is also enabled, turns on serde's
# `std` feature so its `Serialize` impls for std-only types (`PathBuf`,
# `SystemTime`, …) become available.
std = ["serde?/std"]
# Enables `Template::parse_glob` (loads templates by glob pattern). Implies
# `std`; disabling `std` therefore also drops `glob`.
glob = ["std", "dep:glob"]
# Enables Go `html/template`-style context-aware auto-escaping via
# `gotmpl::html::Template`. Pure `alloc` (no_std-compatible); adds a gated
# `Value::Safe` variant carrying trusted content that bypasses escaping.
html = []
# Enables serde integration: `gotmpl::to_value` and the `ToSerdeValue`
# extension trait convert any `serde::Serialize` type into a `Value`. Pure
# `alloc` (no_std-compatible).
serde = ["dep:serde"]
# When enabled, the test suite additionally shells out to a Go helper and
# asserts output parity with Go's `text/template`. Intended for tests only;
# requires a `go` toolchain on PATH.
go-crosscheck = []

[dependencies]
thiserror = "2"
smol_str = { version = "0.3", default-features = false }
glob = { version = "0.3", optional = true }
serde = { version = "1", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

# The html example only builds with the `html` feature enabled.
[[example]]
name = "html"
required-features = ["html"]

# The serde example only builds with the `serde` feature enabled.
[[example]]
name = "serde"
required-features = ["serde"]

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
debug = true
strip = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
